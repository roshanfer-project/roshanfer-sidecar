services:

  ingress-plain:
    image: sidecar-sidecar:latest
    container_name: ingress-plain
    restart: no
    environment:
      - PROC_NAME=ingress-plain
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/ingress-plain.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "3000:3000"   # hotels listen_port
    privileged: true
    cpuset: "15,16"

  ingress-sidecar:
    image: sidecar-sidecar:latest
    container_name: ingress-sidecar
    restart: no
    environment:
      - PROC_NAME=ingress-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/ingress.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4000:4000" # egress_listener_port
      - "3000:3000"   # hotels listen_port
    privileged: true
    cpuset: "15,16"

  app-sidecar:
    image: sidecar-sidecar:latest
    container_name: app-sidecar
    restart: no
    environment:
      - PROC_NAME=app-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/app.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4007:4007" # egress_listener_port
      - "3007:3007"   # ingress_listener_port
    privileged: true
    cpuset: "17,18"

  node2-sidecar:
    image: sidecar-sidecar:latest
    container_name: node2-sidecar
    restart: no
    environment:
      - PROC_NAME=node2-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/node2.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4005:4005" # egress_listener_port
      - "3005:3005" # ingress_listener_port
    privileged: true
    cpuset: "19,20"

  node3-sidecar:
    image: sidecar-sidecar:latest
    container_name: node3-sidecar
    restart: no
    environment:
      - PROC_NAME=node3-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/node3.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4006:4006" # egress_listener_port
      - "3006:3006" # ingress_listener_port
    privileged: true
    cpuset: "21,22"
