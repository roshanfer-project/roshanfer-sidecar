services:

  ingress-plain:
    image: sidecar-sidecar:latest
    container_name: ingress-plain
    restart: no
    environment:
      - PROC_NAME=ingress-plain
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/ingress-plain.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "3000:3000"   # hotels listen_port
    privileged: true
    cpuset: "21,22"

  ingress-sidecar:
    image: sidecar-sidecar:latest
    container_name: ingress-sidecar
    restart: no
    environment:
      - PROC_NAME=ingress-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/ingress.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "3000:3000"   # app listen_port
      - "3008:3008"   # app2 listen_port
    privileged: true
    cpuset: "22,23,1,2"

  app-sidecar:
    image: sidecar-sidecar:latest
    container_name: app-sidecar
    restart: no
    environment:
      - PROC_NAME=app-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/app.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4007:4007" # egress_listener_port
      - "3007:3007"   # ingress_listener_port
    privileged: true
    cpuset: "20,21"

  backend1-sidecar:
    image: sidecar-sidecar:latest
    container_name: backend1-sidecar
    restart: no
    environment:
      - PROC_NAME=backend1-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/backend1.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4005:4005" # egress_listener_port
      - "3005:3005" # ingress_listener_port
    privileged: true
    cpuset: "18,19"

  backend2-sidecar:
    image: sidecar-sidecar:latest
    container_name: backend2-sidecar
    restart: no
    environment:
      - PROC_NAME=backend2-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/backend2.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4006:4006" # egress_listener_port
      - "3006:3006" # ingress_listener_port
    privileged: true
    cpuset: "16,17"

  backend3-sidecar:
    image: sidecar-sidecar:latest
    container_name: backend3-sidecar
    restart: no
    environment:
      - PROC_NAME=backend3-sidecar
      - GLOG_logtostderr=1
    volumes:
      - ./.configs/backend3.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4009:4009" # egress_listener_port
      - "3009:3009" # ingress_listener_port
    privileged: true
    cpuset: "14,15"
