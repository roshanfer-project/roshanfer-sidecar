services:

  ingress-envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: ingress-envoy
    restart: no
    volumes:
      - ./.configs/envoy-ingress.yaml:/etc/envoy/envoy.yaml
    ports:
      - "3000:3000"
      - "3009:3009"
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --concurrency 3 --disable-hot-restart
    cpuset: "20,21,22"

  ingress-sidecar:
    image: sidecar-sidecar:latest
    container_name: ingress-sidecar
    restart: no
    environment:
      - PROC_NAME=ingress-sidecar
      - GLOG_logtostderr=1
#      - GLOG_v=1
#      - GLOG_vmodule=stats=1
    volumes:
      - ./.configs/ingress.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4000:4000" # egress_listener_port
      - "3000:3000"   # hotels listen_port
      - "3009:3009"   # reservation listen_port
    privileged: true
    cpuset: "22,23"

  app-sidecar:
    image: sidecar-sidecar:latest
    container_name: app-sidecar
    restart: no
    environment:
      - PROC_NAME=app-sidecar
      - GLOG_logtostderr=1
#      - GLOG_v=1
#      - GLOG_vmodule=stats=1
    volumes:
      - ./.configs/app.yaml:/config.yaml
      - /usr/local/lib:/usr/local/lib:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    ports:
      - "4007:4007" # egress_listener_port
      - "3007:3007"   # ingress_listener_port
    privileged: true
    cpuset: "20,21"